[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -q      简洁输出
# --tb=short  失败时只显示关键堆栈（默认太长）
# -p no:cacheprovider  不生成 .pytest_cache 目录（保持项目干净）
addopts = -q --tb=short -p no:cacheprovider --strict-markers

filterwarnings =
    ignore::DeprecationWarning
